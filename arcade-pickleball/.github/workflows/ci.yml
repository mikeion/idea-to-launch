# Inert while the game lives inside idea-to-launch (GitHub only reads the repo
# root's .github/). It takes effect as-is once arcade-pickleball is its own repo.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
